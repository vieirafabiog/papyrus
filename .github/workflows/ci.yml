name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test and Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine3.21
        env:
          POSTGRES_USER: docuflow
          POSTGRES_PASSWORD: docuflow_ci_password
          POSTGRES_DB: docuflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docuflow -d docuflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency and license audit
        run: pnpm audit:deps

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          DATABASE_URL: postgresql://docuflow:docuflow_ci_password@127.0.0.1:5432/docuflow_ci
        run: pnpm test
