name: papyrus

services:
  postgres:
    image: postgres:16.8-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papyrus}
      POSTGRES_USER: ${POSTGRES_USER:-papyrus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - papyrus_postgres_data:/var/lib/postgresql/data
    networks:
      - papyrus_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-papyrus} -d $${POSTGRES_DB:-papyrus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        PAPYRUS_VERSION: ${PAPYRUS_IMAGE_TAG:-1.0.0-rc.1}
        VCS_REF: ${VCS_REF:-unknown}
    image: papyrus-api:${PAPYRUS_IMAGE_TAG:-1.0.0-rc.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      HOST: "0.0.0.0"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      STORAGE_DEFAULT_CONNECTION: ${STORAGE_DEFAULT_CONNECTION:-local-default}
      STORAGE_LOCAL_ROOT: /var/lib/papyrus/storage
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      PROXY_MAX_BODY_BYTES: ${PROXY_MAX_BODY_BYTES:-54525952}
      UPLOAD_ALLOWED_EXTENSIONS: ${UPLOAD_ALLOWED_EXTENSIONS:-.pdf,.png,.jpg,.jpeg,.webp,.gif,.tif,.tiff,.bmp,.txt,.log,.md,.csv,.json,.docx,.xlsx,.pptx}
      WORKER_HEALTH_URL: ${WORKER_HEALTH_URL:-http://worker:3001/health/ready}
      OFFICE_CONVERTER_URL: ${OFFICE_CONVERTER_URL:-http://gotenberg:3000}
      MICROSOFT_AUTH_TENANT_ID: ${MICROSOFT_AUTH_TENANT_ID:-}
      MICROSOFT_AUTH_CLIENT_ID: ${MICROSOFT_AUTH_CLIENT_ID:-}
      MICROSOFT_AUTH_CLIENT_SECRET: ${MICROSOFT_AUTH_CLIENT_SECRET:-}
      MICROSOFT_AUTH_REDIRECT_URI: ${MICROSOFT_AUTH_REDIRECT_URI:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    volumes:
      - papyrus_storage_data:/var/lib/papyrus/storage
    tmpfs:
      - /tmp
    networks:
      - papyrus_internal
      - papyrus_edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
      args:
        PAPYRUS_VERSION: ${PAPYRUS_IMAGE_TAG:-1.0.0-rc.1}
        VCS_REF: ${VCS_REF:-unknown}
    image: papyrus-worker:${PAPYRUS_IMAGE_TAG:-1.0.0-rc.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      WORKER_HEALTH_HOST: "0.0.0.0"
      WORKER_HEALTH_PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      STORAGE_DEFAULT_CONNECTION: ${STORAGE_DEFAULT_CONNECTION:-local-default}
      STORAGE_LOCAL_ROOT: /var/lib/papyrus/storage
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      UPLOAD_ALLOWED_EXTENSIONS: ${UPLOAD_ALLOWED_EXTENSIONS:-.pdf,.png,.jpg,.jpeg,.webp,.gif,.tif,.tiff,.bmp,.txt,.log,.md,.csv,.json,.docx,.xlsx,.pptx}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-30000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3001"
    volumes:
      - papyrus_storage_data:/var/lib/papyrus/storage
    tmpfs:
      - /tmp
    networks:
      - papyrus_internal
      - papyrus_edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--api-timeout=30s"
      - "--chromium-disable-routes=true"
    networks:
      - papyrus_internal
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        PAPYRUS_VERSION: ${PAPYRUS_IMAGE_TAG:-1.0.0-rc.1}
        VCS_REF: ${VCS_REF:-unknown}
    image: papyrus-web:${PAPYRUS_IMAGE_TAG:-1.0.0-rc.1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks:
      - papyrus_edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  papyrus_postgres_data:
  papyrus_storage_data:

networks:
  papyrus_internal:
    driver: bridge
    internal: true
  papyrus_edge:
    driver: bridge
