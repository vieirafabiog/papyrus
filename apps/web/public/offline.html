<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F5C4D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>papyrus</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", "Roboto", "Helvetica Neue", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: #faf8f4;
        color: #1c1b18;
      }
      main {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border: 1px solid #dbd4c7;
        border-radius: 12px;
        padding: 32px;
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .wordmark {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #1f5c4d;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: #57534a;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 0.875rem;
        font-weight: 600;
        background: #1f5c4d;
        color: #ffffff;
        cursor: pointer;
      }
      button:hover {
        background: #143f34;
      }
      button:focus-visible {
        outline: 2px solid #1f5c4d;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg width="36" height="36" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M39 6a4 4 0 0 1 4 4 4 4 0 0 1-4 4h-4v-4a4 4 0 0 1 4-4Z" fill="#B07D3A" />
          <path d="M9 42a4 4 0 0 1-4-4 4 4 0 0 1 4-4h4v4a4 4 0 0 1-4 4Z" fill="#B07D3A" />
          <path
            d="M17 6h22a4 4 0 0 0-4 4v28a4 4 0 0 1-4 4H9a4 4 0 0 0 4-4V10a4 4 0 0 1 4-4Z"
            fill="#1F5C4D"
          />
          <rect x="18" y="16" width="12" height="2.6" rx="1.3" fill="#FFFFFF" />
          <rect x="18" y="22.7" width="12" height="2.6" rx="1.3" fill="#FFFFFF" />
          <rect x="18" y="29.4" width="8" height="2.6" rx="1.3" fill="#FFFFFF" />
        </svg>
        <span class="wordmark">papyrus</span>
      </div>
      <h1 id="offline-title">You are offline</h1>
      <p id="offline-desc">
        papyrus requires an active connection to access your organization's documents securely.
      </p>
      <button id="offline-retry" type="button">Try again</button>
    </main>
    <script>
      (function () {
        try {
          if (window.localStorage.getItem("papyrus_ui_locale") === "pt-BR") {
            document.documentElement.lang = "pt-BR";
            document.getElementById("offline-title").textContent = "Você está sem conexão";
            document.getElementById("offline-desc").textContent =
              "O papyrus precisa de conexão ativa para acessar os documentos da organização com segurança.";
            document.getElementById("offline-retry").textContent = "Tentar novamente";
          }
        } catch (_err) {
          // Keep default English copy if storage is unavailable.
        }
        document.getElementById("offline-retry").addEventListener("click", function () {
          window.location.reload();
        });
      })();
    </script>
  </body>
</html>
